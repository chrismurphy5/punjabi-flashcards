<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Punjabi Flashcards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punjabi">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card-hover: #222634;
  --text: #e8eaf0;
  --muted: #8b90a0;
  --accent: #4f8cff;
  --accent-2: #7c5cff;
  --green: #2ecc71;
  --red: #e74c3c;
  --orange: #f39c12;
  --border: #2a2e3d;
  --radius: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.container { width: 100%; max-width: 640px; margin: 0 auto; padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom)); }

/* Header */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.header h1 { font-size: 22px; font-weight: 700; }
.header .logo { font-size: 28px; }
.stats-bar { display: flex; gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border-radius: var(--radius); padding: 12px 16px; flex: 1; text-align: center; }
.stat .num { font-size: 24px; font-weight: 700; }
.stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* Mode tabs */
.mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.mode-tab {
  flex: 1; padding: 12px; text-align: center; border-radius: var(--radius);
  background: var(--card); border: 2px solid transparent; color: var(--muted);
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.mode-tab.active { border-color: var(--accent); color: var(--text); background: var(--card-hover); }

/* Section list */
.section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.section-card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  cursor: pointer; transition: background 0.2s; border: 1px solid var(--border);
}
.section-card:active { background: var(--card-hover); }
.section-card .sec-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.section-card .sec-count { font-size: 12px; color: var(--muted); }
.section-card .sec-gur { font-size: 13px; color: var(--accent); margin-top: 4px; }

/* Category list */
.category-list { display: flex; flex-direction: column; gap: 8px; }
.category-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--card); border-radius: var(--radius); padding: 14px 16px;
  cursor: pointer; transition: background 0.2s; border: 1px solid var(--border);
}
.category-item:active { background: var(--card-hover); }
.category-item .cat-name { font-size: 15px; font-weight: 500; }
.category-item .cat-count { font-size: 13px; color: var(--muted); }
.category-item .cat-due { font-size: 12px; color: var(--orange); font-weight: 600; }

/* Back button */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
  font-size: 14px; margin-bottom: 16px; cursor: pointer; background: none; border: none;
}
.back-btn:active { color: var(--text); }

/* Flashcard */
.card-container { perspective: 1000px; margin-bottom: 20px; }
.flashcard {
  background: var(--card); border-radius: var(--radius); padding: 32px 24px;
  min-height: 280px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; cursor: pointer; border: 1px solid var(--border);
  transition: transform 0.4s; transform-style: preserve-3d; position: relative;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0; padding: 32px 24px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.flashcard-back { transform: rotateY(180deg); }
.card-english { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 12px; }
.card-gurmukhi { font-size: 32px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.card-romanized { font-size: 18px; color: var(--accent); text-align: center; margin-bottom: 16px; }
.card-example { font-size: 14px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; }
.card-example-gur { font-size: 16px; color: var(--text); margin-top: 4px; }
.card-hint { font-size: 12px; color: var(--muted); margin-top: 20px; }
.card-note-input {
  width: 90%; margin-top: 16px; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text);
  font-size: 13px; line-height: 1.4; resize: vertical; min-height: 36px; max-height: 120px;
  font-family: inherit;
}
.card-note-input:focus { outline: none; border-color: var(--accent); }
.card-note-input::placeholder { color: var(--muted); font-size: 12px; }

/* Voice note buttons */
.voice-note-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.voice-btn, .voice-play-btn, .voice-del-btn {
  padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; gap: 4px;
}
.voice-btn:active { background: var(--card-hover); }
.voice-btn.recording { background: var(--red); color: white; border-color: var(--red); animation: pulse 1s infinite; }
.voice-play-btn { color: var(--green); }
.voice-del-btn { color: var(--red); padding: 8px 10px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Create card form */
.create-section { margin-bottom: 20px; }
.create-label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.create-input {
  width: 100%; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 16px; font-family: inherit; resize: vertical;
}
.create-input:focus { outline: none; border-color: var(--accent); }
.create-input::placeholder { color: var(--muted); }

/* Audio buttons */
.audio-row { display: flex; gap: 10px; margin-top: 12px; }
.audio-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--card); color: var(--accent); font-size: 18px; display: flex;
  align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
}
.audio-btn:active { background: var(--accent); color: var(--bg); }
.audio-btn.playing { background: var(--accent); color: var(--bg); }
.ex-btn { font-size: 11px; padding: 0 10px; width: auto; min-width: 44px; height: 36px; border-radius: 18px; }

/* SRS rating buttons */
.rating-row { display: flex; gap: 8px; margin-top: 16px; }
.rate-btn {
  flex: 1; padding: 14px 8px; border-radius: var(--radius); border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
}
.rate-again { background: var(--red); color: white; }
.rate-hard { background: var(--orange); color: white; }
.rate-good { background: var(--green); color: white; }
.rate-easy { background: var(--accent); color: white; }
.rate-btn:active { opacity: 0.7; }
.rate-btn .interval { display: block; font-size: 11px; font-weight: 400; opacity: 0.8; margin-top: 2px; }

/* Progress bar */
.progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

/* Session complete */
.complete-screen { text-align: center; padding: 40px 20px; }
.complete-screen .emoji { font-size: 64px; margin-bottom: 16px; }
.complete-screen h2 { font-size: 22px; margin-bottom: 8px; }
.complete-screen p { color: var(--muted); margin-bottom: 24px; }
.btn-primary {
  background: var(--accent); color: white; border: none; padding: 14px 32px;
  border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer;
}
.btn-primary:active { opacity: 0.8; }
.btn-secondary {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  padding: 14px 32px; border-radius: var(--radius); font-size: 16px; font-weight: 600;
  cursor: pointer; margin-left: 8px;
}

/* Nav */
.card-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.nav-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.nav-info { font-size: 14px; color: var(--muted); }

/* Search */
.search-box {
  width: 100%; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 15px; margin-bottom: 16px;
}
.search-box:focus { outline: none; border-color: var(--accent); }
.search-box::placeholder { color: var(--muted); }

/* Auto-play bar */
.autoplay-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: var(--radius); padding: 10px 12px;
  margin-bottom: 14px; border: 1px solid var(--border);
}
.autoplay-btn {
  background: var(--accent); color: white; border: none;
  padding: 10px 18px; border-radius: var(--radius); font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.autoplay-btn:active { opacity: 0.8; }
.autoplay-btn.stop { background: var(--red); }
.autoplay-btn.pause { background: var(--orange); }
.autoplay-label { font-size: 12px; color: var(--muted); }
.autoplay-select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: inherit; cursor: pointer;
}
.autoplay-select:focus { outline: none; border-color: var(--accent); }
.autoplay-status {
  font-size: 12px; color: var(--muted); margin-left: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;
}

/* Hidden */
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- App loads here -->
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// FSRS Spaced Repetition (simplified, ts-fsrs compatible)
// ═══════════════════════════════════════════════════════════════════
const FSRS = {
  w: [1, 1.2, 2.4, 5.8, 9.2, 11.6, 14, 16.4, 18.8, 21.2, 23.6, 26, 28.4, 30.8, 33.2, 35.6],
  request_retention: 0.9,
  maximum_interval: 36500,
  
  createEmptyCard() {
    return { due: Date.now(), stability: 0, difficulty: 0, reps: 0, lapses: 0, state: 0, last_review: null };
  },
  
  // Rating: 1=Again, 2=Hard, 3=Good, 4=Easy
  update(card, rating, now) {
    now = now || Date.now();
    const { state, reps, stability, difficulty, lapses } = card;
    
    let newState, newStability, newDifficulty, newReps, newLapses, newInterval;
    
    if (state === 0 || state === 1) { // New or Learning
      if (rating === 1) {
        newState = 1;
        newStability = this.w[1] * 0.5;
        newDifficulty = this.w[0] + 1.2;
        newReps = 0;
        newLapses = lapses + 1;
        newInterval = 1; // 1 minute (in days = very small)
      } else {
        newState = 2; // Review
        newStability = this.w[rating - 1];
        newDifficulty = this.w[0] - (rating - 3) * 0.1;
        newReps = 1;
        newLapses = lapses;
        newInterval = this.w[rating + 1] / this.w[2]; // Initial intervals
      }
    } else if (state === 2) { // Review
      if (rating === 1) {
        newState = 3; // Relearning
        newStability = stability * 0.3;
        newDifficulty = Math.max(1, difficulty + 0.3);
        newReps = reps;
        newLapses = lapses + 1;
        newInterval = 1;
      } else {
        newState = 2;
        const hardFactor = rating === 2 ? 0.8 : 1.0;
        const easeFactor = Math.max(1.3, 2.5 - (difficulty - this.w[0]) / 10);
        newStability = stability * easeFactor * hardFactor * (rating === 4 ? 1.3 : 1.0);
        newDifficulty = Math.max(1, Math.min(10, difficulty + (rating - 3) * 0.1));
        newReps = reps + 1;
        newLapses = lapses;
        newInterval = Math.min(this.maximum_interval, Math.round(newStability));
      }
    } else if (state === 3) { // Relearning
      if (rating === 1) {
        newState = 3;
        newStability = stability * 0.3;
        newDifficulty = Math.max(1, difficulty + 0.3);
        newReps = reps;
        newLapses = lapses + 1;
        newInterval = 1;
      } else {
        newState = 2;
        newStability = stability * 1.2;
        newDifficulty = Math.max(1, difficulty - 0.1);
        newReps = reps + 1;
        newLapses = lapses;
        newInterval = Math.min(this.maximum_interval, Math.round(newStability));
      }
    }
    
    newInterval = Math.max(1, newInterval);
    const intervalMs = newInterval < 1 ? newInterval * 60 * 1000 : newInterval * 24 * 60 * 60 * 1000;
    
    return {
      due: now + intervalMs,
      stability: newStability,
      difficulty: newDifficulty,
      reps: newReps,
      lapses: newLapses,
      state: newState,
      last_review: now,
    };
  },
  
  formatInterval(days) {
    if (days < 1) {
      const mins = Math.round(days * 24 * 60);
      if (mins < 60) return `${mins}m`;
      return `${Math.round(mins / 60)}h`;
    }
    if (days < 30) return `${Math.round(days)}d`;
    if (days < 365) return `${Math.round(days / 30)}mo`;
    return `${(days / 365).toFixed(1)}y`;
  },
};

// ═══════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════
const STORAGE_KEY = 'punjabi_flashcards_v1';
const CUSTOM_KEY = 'punjabi_flashcards_custom';
let deck = null;
let progress = {};
let notes = {};
let customCards = [];
let currentView = 'home';
let currentSection = null;
let currentCategory = null;
let sessionCards = [];
let sessionIndex = 0;
let isFlipped = false;
let browseIndex = 0;
let browseCards = [];

function loadProgress() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    progress = saved ? JSON.parse(saved) : {};
  } catch { progress = {}; }
  try {
    notes = JSON.parse(localStorage.getItem(STORAGE_KEY + '_notes') || '{}');
  } catch { notes = {}; }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  localStorage.setItem(STORAGE_KEY + '_notes', JSON.stringify(notes));
}

function getCardNote(cardId) {
  return notes[cardId] || '';
}

function setCardNote(cardId, text) {
  if (text.trim()) {
    notes[cardId] = text.trim();
  } else {
    delete notes[cardId];
  }
  saveProgress();
}

// ═══════════════════════════════════════════════════════════════════
// Custom Cards (user-created, stored in localStorage + IndexedDB)
// ═══════════════════════════════════════════════════════════════════
let customCardDB = null;
let customRecState = { side: null, recorder: null, chunks: [] };

function openCustomCardDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('punjabi_custom_cards', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveCustomAudio(cardId, side, blob) {
  if (!customCardDB) customCardDB = await openCustomCardDB();
  return new Promise((resolve, reject) => {
    const tx = customCardDB.transaction('audio', 'readwrite');
    tx.objectStore('audio').put(blob, cardId + '_' + side);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getCustomAudio(cardId, side) {
  if (!customCardDB) customCardDB = await openCustomCardDB();
  return new Promise((resolve, reject) => {
    const tx = customCardDB.transaction('audio', 'readonly');
    const req = tx.objectStore('audio').get(cardId + '_' + side);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function deleteCustomAudio(cardId, side) {
  if (!customCardDB) customCardDB = await openCustomCardDB();
  return new Promise((resolve, reject) => {
    const tx = customCardDB.transaction('audio', 'readwrite');
    tx.objectStore('audio').delete(cardId + '_' + side);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function loadCustomCards() {
  try {
    customCards = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
  } catch { customCards = []; }
}

function saveCustomCards() {
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(customCards));
}

function mergeCustomCards() {
  // Add custom cards to the deck if not already present
  if (!deck) return;
  const existingIds = new Set(deck.cards.map(c => c.id));
  for (const cc of customCards) {
    if (!existingIds.has(cc.id)) {
      deck.cards.push(cc);
    }
  }
}

function createCustomCard(en, gur, rom, exEn, exGur) {
  const id = 'custom-' + Date.now();
  const card = {
    id: id,
    en: en,
    rom: rom || '',
    gur: gur || '',
    sec: "Chris's Custom Cards",
    cat: 'General',
    ex_en: exEn || null,
    ex_gur: exGur || null,
    ex_rom: null,
  };
  customCards.push(card);
  saveCustomCards();
  mergeCustomCards();
  return id;
}

// Audio recording for custom card creation
async function startCustomRecord(side, btn) {
  // Stop if already recording
  if (customRecState.recorder && customRecState.recorder.state === 'recording') {
    customRecState.recorder.stop();
    return;
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    customRecState.chunks = [];
    customRecState.side = side;
    
    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'audio/mp4';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';
    }
    
    customRecState.recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    
    customRecState.recorder.ondataavailable = (e) => {
      if (e.data.size > 0) customRecState.chunks.push(e.data);
    };
    
    customRecState.recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(customRecState.chunks, { type: customRecState.recorder.mimeType || 'audio/webm' });
      
      // Store temporarily with a pending key
      const tempKey = 'pending_' + customRecState.side;
      await saveCustomAudio('pending', customRecState.side, blob);
      
      // Update UI
      const recBtn = document.getElementById('rec-' + customRecState.side);
      if (recBtn) {
        recBtn.classList.remove('recording');
        recBtn.textContent = '🎤 Record';
      }
      const playBtn = document.getElementById('rec-play-' + customRecState.side);
      const delBtn = document.getElementById('rec-del-' + customRecState.side);
      if (playBtn) playBtn.classList.remove('hidden');
      if (delBtn) delBtn.classList.remove('hidden');
      
      customRecState.side = null;
      customRecState.chunks = [];
    };
    
    customRecState.recorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹ Stop';
    
  } catch (e) {
    alert('Microphone access needed: ' + e.message);
  }
}

async function playCustomRecord(side, btn) {
  const blob = await getCustomAudio('pending', side);
  if (!blob) return;
  
  if (currentAudio) {
    currentAudio.pause();
    if (currentAudio._btn) currentAudio._btn.classList.remove('playing');
  }
  
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio._btn = btn;
  if (btn) btn.classList.add('playing');
  audio.onended = () => { if (btn) btn.classList.remove('playing'); URL.revokeObjectURL(url); };
  currentAudio = audio;
  audio.play().catch(() => { if (btn) btn.classList.remove('playing'); });
}

async function deleteCustomRecord(side) {
  await deleteCustomAudio('pending', side);
  const playBtn = document.getElementById('rec-play-' + side);
  const delBtn = document.getElementById('rec-del-' + side);
  if (playBtn) playBtn.classList.add('hidden');
  if (delBtn) delBtn.classList.add('hidden');
}

function renderCreateCard() {
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <button class="back-btn" onclick="currentView='home';render()">← Home</button>
      <span style="font-size:16px;font-weight:600;">New Flashcard</span>
    </div>
    
    <div class="create-section">
      <label class="create-label">English</label>
      <textarea class="create-input" id="new-en" placeholder="Type English text..." rows="2"></textarea>
      <div class="voice-note-row">
        <button class="voice-btn" id="rec-en" onclick="startCustomRecord('en',this)">🎤 Record</button>
        <button class="voice-play-btn hidden" id="rec-play-en" onclick="playCustomRecord('en',this)">▶️ Play</button>
        <button class="voice-del-btn hidden" id="rec-del-en" onclick="deleteCustomRecord('en')">🗑️</button>
      </div>
    </div>
    
    <div class="create-section">
      <label class="create-label">Punjabi (Gurmukhi)</label>
      <textarea class="create-input" id="new-gur" placeholder="Type Punjabi text..." rows="2"></textarea>

// Play custom card audio (used in card view for custom cards)
async function playCustomCardAudio(cardId, side, btn) {
  const blob = await getCustomAudio(cardId, side);
  if (!blob) {
    // Fallback to gTTS files for non-custom cards
    return false;
  }
  if (currentAudio) {
    currentAudio.pause();
    if (currentAudio._btn) currentAudio._btn.classList.remove('playing');
  }
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio._btn = btn;
  if (btn) btn.classList.add('playing');
  audio.onended = () => { if (btn) btn.classList.remove('playing'); URL.revokeObjectURL(url); };
  currentAudio = audio;
  audio.play().catch(() => { if (btn) btn.classList.remove('playing'); });
  return true;
}

function getCardProgress(cardId) {
  if (!progress[cardId]) {
    progress[cardId] = FSRS.createEmptyCard();
  }
  return progress[cardId];
}

function isDue(cardId) {
  const p = progress[cardId];
  if (!p) return true; // Never studied = due (new)
  return p.due <= Date.now();
}

function getDueCount() {
  if (!deck) return 0;
  return deck.cards.filter(c => isDue(c.id)).length;
}

function getStudiedCount() {
  return Object.keys(progress).filter(id => progress[id].reps > 0).length;
}

function getTotalCards() {
  return deck ? deck.cards.length : 0;
}

// ═══════════════════════════════════════════════════════════════════
// Voice Notes (IndexedDB + MediaRecorder)
// ═══════════════════════════════════════════════════════════════════
let voiceDB = null;
let mediaRecorder = null;
let audioChunks = [];
let recordingCardId = null;

function openVoiceDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('punjabi_voice_notes', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('voiceNotes')) {
        db.createObjectStore('voiceNotes');
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveVoiceNote(cardId, blob) {
  if (!voiceDB) voiceDB = await openVoiceDB();
  return new Promise((resolve, reject) => {
    const tx = voiceDB.transaction('voiceNotes', 'readwrite');
    const store = tx.objectStore('voiceNotes');
    store.put(blob, cardId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getVoiceNote(cardId) {
  if (!voiceDB) voiceDB = await openVoiceDB();
  return new Promise((resolve, reject) => {
    const tx = voiceDB.transaction('voiceNotes', 'readonly');
    const store = tx.objectStore('voiceNotes');
    const req = store.get(cardId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function deleteVoiceNoteFromDB(cardId) {
  if (!voiceDB) voiceDB = await openVoiceDB();
  return new Promise((resolve, reject) => {
    const tx = voiceDB.transaction('voiceNotes', 'readwrite');
    const store = tx.objectStore('voiceNotes');
    store.delete(cardId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function toggleRecording(cardId, btn) {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    // Stop recording
    mediaRecorder.stop();
    return;
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    recordingCardId = cardId;
    
    // Pick a format iOS Safari supports
    let mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'audio/mp4';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = '';  // let browser pick default
      }
    }
    
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      await saveVoiceNote(recordingCardId, blob);
      
      // Update UI
      const btn2 = document.getElementById('voice-btn-' + recordingCardId);
      if (btn2) {
        btn2.classList.remove('recording');
        btn2.querySelector('.voice-btn-text').textContent = '🎤 Record';
      }
      // Show play/delete buttons
      const playBtn = document.getElementById('voice-play-' + recordingCardId);
      const delBtn = document.getElementById('voice-del-' + recordingCardId);
      if (playBtn) playBtn.classList.remove('hidden');
      if (delBtn) delBtn.classList.remove('hidden');
      
      recordingCardId = null;
      audioChunks = [];
    };
    
    mediaRecorder.start();
    btn.classList.add('recording');
    btn.querySelector('.voice-btn-text').textContent = '⏹ Stop';
    
  } catch (e) {
    alert('Microphone access needed: ' + e.message);
  }
}

async function playVoiceNote(cardId, btn) {
  const blob = await getVoiceNote(cardId);
  if (!blob) return;
  
  if (currentAudio) {
    currentAudio.pause();
    if (currentAudio._btn) currentAudio._btn.classList.remove('playing');
  }
  
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio._btn = btn;
  if (btn) btn.classList.add('playing');
  audio.onended = () => { if (btn) btn.classList.remove('playing'); URL.revokeObjectURL(url); };
  audio.onerror = () => { if (btn) btn.classList.remove('playing'); URL.revokeObjectURL(url); };
  currentAudio = audio;
  audio.play().catch(() => { if (btn) btn.classList.remove('playing'); });
}

async function deleteVoiceNote(cardId) {
  if (!confirm('Delete voice note?')) return;
  await deleteVoiceNoteFromDB(cardId);
  const playBtn = document.getElementById('voice-play-' + cardId);

function renderSections() {
  // Group cards by section
  const sectionData = {};
  for (const card of deck.cards) {
    const sec = card.sec || 'Other Vocabulary';
    if (!sectionData[sec]) sectionData[sec] = { count: 0, due: 0, categories: {} };
    sectionData[sec].count++;
    if (isDue(card.id)) sectionData[sec].due++;
    const cat = card.cat || 'General';
    if (!sectionData[sec].categories[cat]) sectionData[sec].categories[cat] = { count: 0, due: 0 };
    sectionData[sec].categories[cat].count++;
    if (isDue(card.id)) sectionData[sec].categories[cat].due++;
  }
  
  // Also show unthemed cards count
  const unthemedCount = deck.cards.filter(c => !c.sec).length;
  
  let html = `<button class="back-btn" onclick="currentView='home';render()">← Home</button>
    <h2 style="margin-bottom:16px;">Themes</h2>
    <div class="section-grid">`;
  
  for (const [sec, data] of Object.entries(sectionData).sort((a, b) => b[1].count - a[1].count)) {
    const dueBadge = data.due > 0 ? `<span style="color:var(--orange);font-size:12px;"> · ${data.due} due</span>` : '';
    html += `<div class="section-card" onclick="selectSection('${sec.replace(/'/g, "\\'")}')">
      <div class="sec-name">${sec}</div>

  html += `</div>`;
  app.innerHTML = html;

function selectSection(sec) {
  currentSection = sec;
  currentView = 'categories';
  render();
}

function renderCategories() {
  const cards = deck.cards.filter(c => (c.sec || 'Other Vocabulary') === currentSection);
  const catData = {};
  for (const card of cards) {
    const cat = card.cat || 'General';
    if (!catData[cat]) catData[cat] = { count: 0, due: 0, cards: [] };
    catData[cat].count++;
    if (isDue(card.id)) catData[cat].due++;
    catData[cat].cards.push(card);
  }
  
  let html = `<button class="back-btn" onclick="currentView='sections';render()">← Themes</button>
    <h2 style="margin-bottom:16px;">${currentSection}</h2>
    <div class="category-list">`;
  
  for (const [cat, data] of Object.entries(catData).sort((a, b) => b[1].count - a[1].count)) {
    const dueBadge = data.due > 0 ? `<span class="cat-due">${data.due} due</span>` : '';
    html += `<div class="category-item" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">
      <span class="cat-name">${cat}</span>
      <span class="cat-count">${data.count} ${dueBadge}</span>
    </div>`;
  }

  html += `</div>
    <div style="margin-top:16px;">

  app.innerHTML = html;

function selectCategory(cat) {
  currentCategory = cat;
  const cards = deck.cards.filter(c => 
    (c.sec || 'Other Vocabulary') === currentSection && 
    (c.cat || 'General') === currentCategory
  );
  startBrowseSession(cards, 'categories', `← ${currentCategory}`);
}

function studySection() {
  const cards = deck.cards.filter(c => (c.sec || 'Other Vocabulary') === currentSection);
  // Sort: due first, then new
  cards.sort((a, b) => {
    const aDue = isDue(a.id), bDue = isDue(b.id);
    if (aDue && !bDue) return -1;
    if (!aDue && bDue) return 1;
    return 0;
  });
  startBrowseSession(cards.slice(0, 100), 'categories', `← ${currentSection}`);
}

let autoplay = {
  active: false,
  paused: false,
  pauseSec: 2,         // seconds between audio clips
  timerId: null,       // setTimeout handle for the current pause
  playing: false,      // true while audio is actually playing
};

function startBrowseSession(cards, backTarget, backLabel) {
  cardSession = { cards, index: 0, isSRS: false, backTarget, backLabel };
  currentView = 'card';
  render();
}

function startSRSSession() {
  if (!deck) return;
  const dueCards = deck.cards.filter(c => isDue(c.id));
  // Sort: new cards first, then by due date
  dueCards.sort((a, b) => {
    const ap = progress[a.id], bp = progress[b.id];
    if (!ap && !bp) return 0;
    if (!ap) return -1;
    if (!bp) return 1;
    return ap.due - bp.due;
  });
  
  if (dueCards.length === 0) {
    // Nothing due — show a message
    app.innerHTML = `
      <div class="complete-screen">
        <div class="emoji">✅</div>
        <h2>All caught up!</h2>
        <p>No cards are due right now. Come back later or browse themes to study new words.</p>
        <div>
          <button class="btn-primary" onclick="currentView='home';render()">Home</button>
        </div>
      </div>`;
    return;
  }
  
  cardSession = {
    cards: dueCards.slice(0, 100),
    index: 0,
    isSRS: true,
    backTarget: 'home',
    backLabel: 'End',
  };
  currentView = 'card';
  render();
}

// Resolve the audio URL for a card+lang, or null if none.
function getAudioSrc(cardId, lang) {
  if (cardId.startsWith('custom-')) {
    // Custom cards use IndexedDB blobs; we can't easily resolve a URL
    // synchronously. For auto-play, we'll skip custom audio blobs and
    // only play file-based audio. Custom cards without file audio = skip.
    return null;
  }
  return 'audio/' + lang + '/' + cardId + '.mp3';
}

// Play an audio src and resolve when it finishes (or on error).
function playAudioAsync(src) {
  return new Promise((resolve) => {
    if (!src) { resolve(); return; }
    if (currentAudio) {
      currentAudio.pause();
      if (currentAudio._btn) currentAudio._btn.classList.remove('playing');
    }
    const audio = new Audio(src);
    currentAudio = audio;
    audio.onended = () => resolve();
    audio.onerror = () => resolve();
    audio.play().catch(() => resolve());
  });
}

// Play a custom card audio from IndexedDB, async, resolves when done.
async function playCustomAudioAsync(cardId, lang) {
  const side = lang;  // 'en' or 'pa'
  try {
    const blob = await getCustomAudio(cardId, side);
    if (!blob) return false;
    if (currentAudio) {
      currentAudio.pause();
      if (currentAudio._btn) currentAudio._btn.classList.remove('playing');
    }
    const url = URL.createObjectURL(blob);
    await new Promise((resolve) => {
      const audio = new Audio(url);
      currentAudio = audio;
      audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
      audio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
      audio.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
    });
    return true;
  } catch { return false; }
}

// Sleep helper that respects pause state.
function autoplaySleep(ms) {
  return new Promise((resolve) => {
    autoplay.timerId = setTimeout(() => {
      autoplay.timerId = null;
      resolve();
    }, ms);
  });
}

// Main auto-play loop. Iterates through all cards in the current session.
async function startAutoplay() {
  autoplay.active = true;
  autoplay.paused = false;
  updateAutoplayUI();

  // Work on a copy of the card list starting from current index.
  const cards = cardSession.cards;
  let i = cardSession.index;

  while (autoplay.active && i < cards.length) {
    if (autoplay.paused) {
      await autoplaySleep(200);
      continue;
    }

    const card = cards[i];

    // Move to this card if we're not already on it.
    if (cardSession.index !== i) {
      cardSession.index = i;
      renderCard();  // re-render to show current card
      updateAutoplayUI();  // restore autoplay button state after re-render
    }

    // Update status text.
    setAutoplayStatus('▶ EN…');

    // Play English audio.
    if (card.id.startsWith('custom-')) {
      await playCustomAudioAsync(card.id, 'en');
    } else {
      await playAudioAsync(getAudioSrc(card.id, 'en'));
    }

    if (!autoplay.active) break;

    // Pause between EN and PA.
    setAutoplayStatus(`⏸ ${autoplay.pauseSec}s…`);
    await autoplaySleep(autoplay.pauseSec * 1000);
    if (!autoplay.active) break;

    if (autoplay.paused) { continue; }

    // Play Punjabi audio.
    setAutoplayStatus('▶ PA…');
    if (card.id.startsWith('custom-')) {
      await playCustomAudioAsync(card.id, 'pa');
    } else {
      await playAudioAsync(getAudioSrc(card.id, 'pa'));
    }

    if (!autoplay.active) break;

    // Pause before next card.
    setAutoplayStatus(`⏸ ${autoplay.pauseSec}s → next…`);
    await autoplaySleep(autoplay.pauseSec * 1000);
    if (!autoplay.active) break;

    i++;
  }

  // If we finished all cards naturally, show the complete screen.
  if (autoplay.active && i >= cards.length) {
    autoplay.active = false;
    setAutoplayStatus('');
    renderCard();  // shows session complete if applicable
  }

  updateAutoplayUI();
}

function toggleAutoplay() {
  if (!autoplay.active) {
    startAutoplay();
  } else {
    autoplay.paused = !autoplay.paused;
    if (autoplay.paused) {
      // Pause any currently playing audio.
      if (currentAudio) currentAudio.pause();
      setAutoplayStatus('⏸ Paused');
    } else {
      setAutoplayStatus('▶ Resuming…');
    }
    updateAutoplayUI();
  }
}

function stopAutoplay() {
  autoplay.active = false;
  autoplay.paused = false;
  if (autoplay.timerId) { clearTimeout(autoplay.timerId); autoplay.timerId = null; }
  if (currentAudio) { currentAudio.pause(); }
  setAutoplayStatus('');
  updateAutoplayUI();
}

function setAutoplayStatus(text) {
  const el = document.getElementById('autoplay-status');
  if (el) el.textContent = text;
}

function updateAutoplayUI() {
  const bar = document.getElementById('autoplay-bar');
  if (!bar) return;
  const btn = document.getElementById('autoplay-toggle-btn');
  const stopBtn = document.getElementById('autoplay-stop-btn');
  const sel = document.getElementById('autoplay-pause-select');
  if (!autoplay.active) {
    if (btn) { btn.textContent = '▶ Auto-Play'; btn.className = 'autoplay-btn'; }
    if (stopBtn) stopBtn.style.display = 'none';
    setAutoplayStatus('');
  } else {
    if (btn) {
      btn.textContent = autoplay.paused ? '▶ Resume' : '⏸ Pause';
      btn.className = 'autoplay-btn ' + (autoplay.paused ? 'pause' : 'stop');
    }
    if (stopBtn) stopBtn.style.display = '';
  }
}

function onAutoplayPauseChange(val) {
  autoplay.pauseSec = parseInt(val, 10);
}

function renderCard() {
  const { cards, index, isSRS, backTarget, backLabel } = cardSession;
  
  if (index >= cards.length) {
    // Session complete
    const studied = index;
    app.innerHTML = `
      <div class="complete-screen">
        <div class="emoji">🎉</div>
        <h2>Session Complete!</h2>
        <p>You reviewed ${studied} cards.</p>
        <div>
          ${isSRS ? '<button class="btn-primary" onclick="startSRSSession()">Review More</button>' : ''}
          <button class="${isSRS ? 'btn-secondary' : 'btn-primary'}" onclick="currentView='${backTarget}';render()">Home</button>
        </div>
      </div>`;
    return;
  }
  
  const card = cards[index];
  const p = getCardProgress(card.id);
  
  // Calculate preview intervals for each rating
  const now = Date.now();
  const r1 = FSRS.update(p, 1, now);
  const r2 = FSRS.update(p, 2, now);
  const r3 = FSRS.update(p, 3, now);
  const r4 = FSRS.update(p, 4, now);
  
  const i1 = (r1.due - now) / (24 * 60 * 60 * 1000);
  const i2 = (r2.due - now) / (24 * 60 * 60 * 1000);
  const i3 = (r3.due - now) / (24 * 60 * 60 * 1000);
  const i4 = (r4.due - now) / (24 * 60 * 60 * 1000);
  
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <button class="back-btn" onclick="cardBack()">${backLabel || '← Back'}</button>
      <span class="nav-info">${index + 1} / ${cards.length}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${((index + 1) / cards.length) * 100}%"></div></div>
    <div class="autoplay-bar" id="autoplay-bar">
      <button class="autoplay-btn" id="autoplay-toggle-btn" onclick="toggleAutoplay()">▶ Auto-Play</button>
      <span class="autoplay-label">Pause:</span>
      <select class="autoplay-select" id="autoplay-pause-select" onchange="onAutoplayPauseChange(this.value)">
        <option value="1" ${autoplay.pauseSec === 1 ? 'selected' : ''}>1s</option>
        <option value="2" ${autoplay.pauseSec === 2 ? 'selected' : ''}>2s</option>
        <option value="3" ${autoplay.pauseSec === 3 ? 'selected' : ''}>3s</option>
        <option value="5" ${autoplay.pauseSec === 5 ? 'selected' : ''}>5s</option>
        <option value="10" ${autoplay.pauseSec === 10 ? 'selected' : ''}>10s</option>
      </select>
      <button class="autoplay-btn stop" onclick="stopAutoplay()" style="background:var(--red);display:none;" id="autoplay-stop-btn">⏹</button>
      <span class="autoplay-status" id="autoplay-status"></span>
    </div>
    <div class="card-container">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="flashcard-face">
          <div class="card-english">${card.en}</div>
          <div class="card-hint">Tap to reveal</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="card-gurmukhi">${card.gur || card.rom}</div>
          ${card.rom ? `<div class="card-romanized">${card.rom}</div>` : ''}
          ${card.ex_en ? `<div class="card-example">${card.ex_en}</div>` : ''}
          ${card.ex_gur ? `<div class="card-example card-example-gur">${card.ex_gur}</div>` : ''}
          ${card.ex_rom ? `<div class="card-example">${card.ex_rom}</div>` : ''}
          <textarea class="card-note-input" placeholder="Notes (alt spellings, usage tips...)" 
            onclick="event.stopPropagation()" 
            oninput="setCardNote('${card.id}', this.value)"
          >${getCardNote(card.id)}</textarea>
          <div class="voice-note-row" onclick="event.stopPropagation()">
            <button class="voice-btn" id="voice-btn-${card.id}" onclick="event.stopPropagation();toggleRecording('${card.id}', this)">
              <span class="voice-btn-text">🎤 Record</span>
            </button>
            <button class="voice-play-btn hidden" id="voice-play-${card.id}" onclick="event.stopPropagation();playVoiceNote('${card.id}', this)">
              ▶️ Play
            </button>
            <button class="voice-del-btn hidden" id="voice-del-${card.id}" onclick="event.stopPropagation();deleteVoiceNote('${card.id}')">
              🗑️
            </button>
          </div>
        </div>
      </div>
      <div class="audio-row" style="justify-content:center; flex-wrap: wrap;">
        <button class="audio-btn" onclick="event.stopPropagation();playCardAudio('${card.id}','en',this)">🔊EN</button>
        <button class="audio-btn" onclick="event.stopPropagation();playCardAudio('${card.id}','pa',this)">🔊ਪੰ</button>
        ${card.ex_en ? `<button class="audio-btn ex-btn" onclick="event.stopPropagation();playExampleAudio('${card.id}','en',this)">🔊Ex EN</button>` : ''}
        ${card.ex_gur ? `<button class="audio-btn ex-btn" onclick="event.stopPropagation();playExampleAudio('${card.id}','pa',this)">🔊Ex ਪੰ</button>` : ''}
      </div>
    </div>
    <div class="rating-row">
      <button class="rate-btn rate-again" onclick="cardRate('${card.id}',1)">
        Again<span class="interval">${FSRS.formatInterval(i1)}</span>
      </button>
      <button class="rate-btn rate-hard" onclick="cardRate('${card.id}',2)">
        Hard<span class="interval">${FSRS.formatInterval(i2)}</span>
      </button>
      <button class="rate-btn rate-good" onclick="cardRate('${card.id}',3)">
        Good<span class="interval">${FSRS.formatInterval(i3)}</span>
      </button>
      <button class="rate-btn rate-easy" onclick="cardRate('${card.id}',4)">
        Easy<span class="interval">${FSRS.formatInterval(i4)}</span>
      </button>
    </div>
    <div class="card-nav">
      <button class="nav-btn" onclick="cardPrev()" ${index === 0 ? 'disabled' : ''}>‹</button>
      <span class="nav-info">Manual nav</span>
      <button class="nav-btn" onclick="cardNext()">›</button>
    </div>
  `;
  
  isFlipped = false;
  
  // Check if this card has an existing voice note
  refreshVoiceNoteUI(card.id);
}

function cardRate(cardId, rating) {
  const p = getCardProgress(cardId);
  const updated = FSRS.update(p, rating, Date.now());
  progress[cardId] = updated;
  saveProgress();
  cardSession.index++;
  renderCard();
}

function cardNext() {
  if (cardSession.index < cardSession.cards.length - 1) {
    cardSession.index++;
    renderCard();
  }
}

function cardPrev() {
  if (cardSession.index > 0) {
    cardSession.index--;
    renderCard();
  }
}

function cardBack() {
  stopAutoplay();
  if (cardSession.isSRS) {
    if (confirm('End session?')) {
      currentView = cardSession.backTarget;
      render();
    }
  } else {
    currentView = cardSession.backTarget;
    render();
  }
}

// Keep old function names for backward compat
function flipCard() {
  const fc = document.getElementById('flashcard');
  if (!fc) return;
  isFlipped = !isFlipped;
  if (isFlipped) {
    fc.classList.add('flipped');
    // Grow card to fit back face content
    const back = fc.querySelector('.flashcard-back');
    if (back) {
      // Temporarily make back visible to measure it
      back.style.visibility = 'visible';
      const contentHeight = back.scrollHeight;
      if (contentHeight > 280) {
        fc.style.minHeight = contentHeight + 'px';
      }
    }
  } else {
    fc.classList.remove('flipped');
    fc.style.minHeight = '280px';
  }
}

// ═══════════════════════════════════════════════════════════════════
// Search
// ═══════════════════════════════════════════════════════════════════
function handleSearch(query) {
  const results = document.getElementById('search-results');
  if (!query || query.length < 2) {
    results.innerHTML = '';
    return;
  }
  const q = query.toLowerCase();
  const matches = deck.cards.filter(c => 
    c.en.toLowerCase().includes(q) || 
    (c.rom && c.rom.toLowerCase().includes(q)) ||
    (c.gur && c.gur.includes(query))
  ).slice(0, 20);
  
  if (matches.length === 0) {
    results.innerHTML = '<div style="color:var(--muted);padding:12px;">No matches found</div>';
    return;
  }
  
  results.innerHTML = '<div class="category-list">' + matches.map(c => 
    `<div class="category-item" onclick='showSearchCard(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
      <span class="cat-name">${c.en} → ${c.gur || c.rom}</span>
      <span class="cat-count">${c.sec || ''}</span>
    </div>`
  ).join('') + '</div>';
}

function showSearchCard(card) {
  startBrowseSession([card], 'home', '← Home');
}

// Init
// ═══════════════════════════════════════════════════════════════════
// Force SW update on every launch
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update();
  });
}

async function init() {
  loadProgress();
  loadCustomCards();
  app.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted);">Loading deck...</div>';
  
  try {
    const resp = await fetch('data/deck.json');
    deck = await resp.json();
    mergeCustomCards();
    render();
  } catch (e) {
    app.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--red);">
      Failed to load deck: ${e.message}<br><br>
      Make sure you're running from the app directory.
    </div>`;
  }
}

init();
</script>
